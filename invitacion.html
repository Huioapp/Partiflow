<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pase de Invitación - Partiflow PRO</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #05070a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }

        .btn-volver {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #1f2937;
            color: #9ca3af;
            padding: 8px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            border: 1px solid #374151;
            transition: all 0.2s;
        }

        .btn-volver:hover {
            color: #ffffff;
            border-color: #3b82f6;
        }

        .invitation-card {
            width: 100%;
            max-width: 480px;
            background: linear-gradient(135deg, #111827, #1f2937);
            border: 1px solid #374151;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .brand-logo {
            max-width: 65px;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
            margin-bottom: 15px;
        }

        h2 {
            font-size: 1.4rem;
            color: #60a5fa;
            margin: 0 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .guest-name {
            font-size: 1.6rem;
            font-weight: 900;
            color: #ffffff;
            margin: 10px 0 20px 0;
            background: linear-gradient(90deg, #60a5fa, #ffffff, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .event-details {
            background: #111827;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #374151;
            margin-bottom: 25px;
            text-align: left;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #d1d5db;
        }

        .event-details strong {
            color: #60a5fa;
        }

        .code-box {
            background: #030712;
            border: 2px dashed #3b82f6;
            padding: 12px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 1.2rem;
            color: #60a5fa;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.2s;
            box-sizing: border-box;
            font-size: 1rem;
            border: none;
        }

        .btn-map {
            background: #374151;
            color: #ffffff;
            border: 1px solid #4b5563;
        }

        .btn-map:hover {
            background: #4b5563;
        }

        .btn-cabina {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.4);
        }

        .btn-cabina:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <a href="index.html" class="btn-volver">← Volver al Inicio</a>

    <div class="invitation-card">
        <img src="Logo_fondo_blanco_solo_icono.png" alt="Logo" class="brand-logo">
        <h2>Invitación Exclusiva</h2>
        <div id="nombreInvitado" class="guest-name">Cargando invitado...</div>

        <div class="event-details">
            <p><strong>Motivo:</strong> Celebración Especial</p>
            <p><strong>Dress Code:</strong> Casual / Elegante</p>
            <p><strong>Fecha y Hora:</strong> Sábado a las 9:00 PM</p>
            <p><strong>Ubicación:</strong> Local Principal (Haz clic abajo para abrir el mapa)</p>
        </div>

        <div id="codigoUnico" class="code-box">VIP-----</div>

        <div class="btn-group">
            <a id="btnMapa" href="https://maps.google.com" target="_blank" class="btn btn-map">
                📍 Ver Ubicación en Google Maps
            </a>
            <a href="index.html" class="btn btn-cabina">
                🎶 Ir a la Cabina y Pedir Música
            </a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const codigoPase = urlParams.get('codigo');

        if (codigoPase) {
            document.getElementById('codigoUnico').textContent = codigoPase;
            document.getElementById('nombreInvitado').textContent = "Invitado Especial";
        } else {
            document.getElementById('nombreInvitado').textContent = "Invitado General";
            document.getElementById('codigoUnico').textContent = "GENERAL-PASS";
        }
    </script>
</body>
</html>
