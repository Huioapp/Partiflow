<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Partiflow PRO</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background-color: #030712;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: #111827;
            border: 1px solid #374151;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            text-align: center;
        }

        .brand-logo {
            max-width: 65px;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
            margin-bottom: 15px;
        }

        h2 {
            font-size: 1.4rem;
            color: #60a5fa;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            font-size: 0.85rem;
            color: #9ca3af;
        }

        .input-group input {
            background: #1f2937;
            border: 1px solid #4b5563;
            padding: 12px;
            border-radius: 10px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        .btn-login {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        .btn-login:hover { opacity: 0.9; }

        .back-link {
            display: block;
            margin-top: 20px;
            color: #9ca3af;
            text-decoration: none;
            font-size: 0.85rem;
        }
        .back-link:hover { color: #60a5fa; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="Logo_fondo_blanco_solo_icono.png" alt="Partiflow PRO" class="brand-logo">
        <h2>Iniciar Sesión</h2>
        
        <div class="input-group">
            <label>Correo Electrónico:</label>
            <input type="email" id="txtEmail" placeholder="tu@correo.com">
        </div>

        <div class="input-group">
            <label>Contraseña:</label>
            <input type="password" id="txtPassword" placeholder="••••••••">
        </div>

        <button class="btn-login" onclick="realizarLogin()">Ingresar al Sistema</button>

        <a href="index.html" class="back-link">← Volver a la Portada</a>
    </div>

    <script>
        function realizarLogin() {
            const email = document.getElementById('txtEmail').value;
            const password = document.getElementById('txtPassword').value;

            if (!email || !password) {
                alert('Por favor completa todos los campos.');
                return;
            }

            // Redirección directa y limpia hacia el Centro de Control unificado (index.html)
            alert('¡Inicio de sesión exitoso!');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
