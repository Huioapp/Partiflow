<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Partiflow PRO</title>
    <!-- Librería global estable de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #05070a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(135deg, #111827, #1f2937);
            border: 1px solid #374151;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
            box-sizing: border-box;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-header img {
            max-width: 65px;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
            margin-bottom: 10px;
        }

        .brand-header h2 {
            font-size: 1.3rem;
            margin: 0;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .brand-header h2 span {
            color: #3b82f6;
        }

        .brand-header p {
            color: #9ca3af;
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
        }

        label {
            font-size: 0.85rem;
            color: #d1d5db;
            font-weight: 600;
        }

        input {
            background: #111827;
            border: 1px solid #4b5563;
            padding: 12px 15px;
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #3b82f6;
        }

        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            color: #9ca3af;
        }

        .btn-submit {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .msg {
            margin-top: 15px;
            text-align: center;
            font-size: 0.85rem;
        }

        .msg.error {
            color: #ef4444;
        }

        .footer-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #9ca3af;
        }

        .footer-link a {
            color: #60a5fa;
            text-decoration: none;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="brand-header">
            <img src="Logo_fondo_blanco_solo_icono.png" alt="Partiflow Isotipo">
            <h2>Partiflow <span>PRO</span></h2>
            <p>Acceso de organizadores</p>
        </div>

        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" placeholder="tucorreo@ejemplo.com">
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="password-container">
                <input type="password" id="password" placeholder="Tu contraseña">
                <button type="button" class="toggle-password" onclick="togglePassword('password', this)">👁️</button>
            </div>
        </div>

        <button class="btn-submit" onclick="iniciarSesion()">Ingresar</button>

        <div id="mensajeAlerta" class="msg"></div>

        <div class="footer-link">
            ¿No tienes una cuenta? <a href="signup.html">Regístrate aquí</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://zfgrewceocnivqglmjqe.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpmZ3Jld2Nlb2NuaXZxZ2xtanFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwNDcxNTEsImV4cCI6MjEwMzYyMzE1MX0.6kB7eC7sh-SpPhyAeVJkPUuvq7PZPoD6PIh8o78k_vY';
        
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function togglePassword(fieldId, btn) {
            const input = document.getElementById(fieldId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = 'ocultar';
                btn.style.fontSize = '0.75rem';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
                btn.style.fontSize = '1.1rem';
            }
        }

        async function iniciarSesion() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const alerta = document.getElementById('mensajeAlerta');

            alerta.className = 'msg';
            alerta.textContent = '';

            if (!email || !password) {
                alerta.className = 'msg error';
                alerta.textContent = 'Por favor ingresa tu correo y contraseña.';
                return;
            }

            const { data, error } = await _supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                alerta.className = 'msg error';
                alerta.textContent = 'Credenciales incorrectas o correo sin confirmar.';
                return;
            }

            // Redirige al panel privado de invitados
            window.location.href = 'dashboard-invitados.html';
        }
    </script>
</body>
</html>
