<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Organizador - Partiflow PRO</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #05070a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .top-bar {
            width: 100%;
            max-width: 700px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111827;
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid #374151;
            margin-bottom: 25px;
            box-sizing: border-box;
        }

        .brand-title {
            font-size: 1.2rem;
            font-weight: 900;
            color: #60a5fa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-acciones-top {
            display: flex;
            gap: 10px;
        }

        .btn-nav {
            background: #1f2937;
            color: #d1d5db;
            border: 1px solid #4b5563;
            padding: 8px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-nav:hover {
            background: #374151;
            color: white;
            border-color: #60a5fa;
        }

        .btn-logout {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .btn-logout:hover { opacity: 0.9; }

        /* Tarjeta de Información de la Fiesta (Con Histórico) */
        .card-fiesta {
            width: 100%;
            max-width: 700px;
            background: #111827;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #374151;
            margin-bottom: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .fiesta-info h2 {
            margin: 0 0 5px 0;
            font-size: 1.3rem;
            color: #ffffff;
        }

        .fiesta-info p {
            margin: 0;
            color: #9ca3af;
            font-size: 0.9rem;
        }

        .badge-estado {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        .badge-activo { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #059669; }
        .badge-historico { background: rgba(107, 114, 128, 0.2); color: #9ca3af; border: 1px solid #4b5563; }

        /* Secciones del Panel */
        .panel-box {
            width: 100%;
            max-width: 700px;
            background: #111827;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #374151;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .panel-box h3 {
            margin: 0 0 15px 0;
            font-size: 1.1rem;
            color: #60a5fa;
        }

        .input-grupo {
            display: flex;
            gap: 10px;
        }

        .input-grupo input {
            flex: 1;
            background: #1f2937;
            border: 1px solid #4b5563;
            padding: 10px 15px;
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        .btn-generar {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #374151;
            font-size: 0.9rem;
        }

        th { color: #9ca3af; }
    </style>
</head>
<body>

    <!-- Barra Superior con Botón de Regreso -->
    <div class="top-bar">
        <div class="brand-title">Partiflow <span style="color: white;">PRO</span></div>
        <div class="btn-acciones-top">
            <a href="index.html" class="btn-nav">🏠 Volver al Inicio</a>
            <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </div>

    <!-- Tarjeta del Nombre y Fecha de la Fiesta (Control de Histórico) -->
    <div class="card-fiesta">
        <div class="fiesta-info">
            <h2 id="lblNombreFiesta">Cumpleaños / Reunión Principal</h2>
            <p>📅 Fecha del Evento: <span id="lblFechaFiesta">2026-09-15</span></p>
        </div>
        <div>
            <span id="badgeEstado" class="badge-estado badge-activo">Activa en Vivo</span>
        </div>
    </div>

    <!-- Registrar Invitado -->
    <div class="panel-box">
        <h3>➕ Registrar Nuevo Invitado</h3>
        <div class="input-grupo">
            <input type="text" id="inputNombre" placeholder="Nombre completo del invitado...">
            <button class="btn-generar" onclick="generarPase()">Generar Pase</button>
        </div>
    </div>

    <!-- Lista de Pases Activos -->
    <div class="panel-box">
        <h3>📋 Lista de Pases Activos</h3>
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Código Único</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tablaInvitados">
                <tr><td colspan="3" style="text-align:center; color:#9ca3af;">No hay invitados registrados.</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // Simulación temporal de datos de la fiesta (luego se conectará con Supabase)
        const fechaFiestaStr = "2026-09-15"; // Aquí cambiará según la fecha que configure el usuario
        const hoy = new Date().toISOString().split('T')[0];

        // Lógica de transición a Histórico
        const badge = document.getElementById('badgeEstado');
        if (fechaFiestaStr < hoy) {
            badge.textContent = "Histórico (Archivado)";
            badge.className = "badge-estado badge-historico";
        } else {
            badge.textContent = "Activa en Vivo";
            badge.className = "badge-estado badge-activo";
        }

        function cerrarSesion() {
            window.location.href = 'index.html';
        }

        function generarPase() {
            const nombreInput = document.getElementById('inputNombre');
            if (!nombreInput.value.trim()) {
                alert('Escribe el nombre del invitado.');
                return;
            }
            alert('Pase generado con éxito para: ' + nombreInput.value);
            nombreInput.value = '';
        }
    </script>
</body>
</html>
