<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Organizador - Partiflow PRO</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #05070a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .top-bar {
            width: 100%;
            max-width: 700px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111827;
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid #374151;
            margin-bottom: 25px;
            box-sizing: border-box;
        }

        .brand-title {
            font-size: 1.2rem;
            font-weight: 900;
            color: #60a5fa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-acciones-top {
            display: flex;
            gap: 10px;
        }

        .btn-nav {
            background: #374151;
            color: #ffffff;
            border: 1px solid #4b5563;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-nav:hover {
            background: #4b5563;
            border-color: #60a5fa;
        }

        .btn-logout {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .btn-logout:hover { opacity: 0.9; }

        /* Panel Principal */
        .panel-box {
            width: 100%;
            max-width: 700px;
            background: #111827;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #374151;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .panel-box h3 {
            margin: 0 0 15px 0;
            font-size: 1.1rem;
            color: #60a5fa;
        }

        .input-grupo {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }

        .input-grupo label {
            font-size: 0.85rem;
            color: #9ca3af;
        }

        .input-grupo input, .input-grupo select {
            background: #1f2937;
            border: 1px solid #4b5563;
            padding: 10px 15px;
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        .btn-generar {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn-generar:hover { opacity: 0.9; }

        .badge-estado {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-left: 10px;
        }
        .badge-activo { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #059669; }
        .badge-historico { background: rgba(107, 114, 128, 0.2); color: #9ca3af; border: 1px solid #4b5563; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #374151;
            font-size: 0.9rem;
        }

        th { color: #9ca3af; }
    </style>
</head>
<body>

    <!-- Barra Superior con el Botón de Regreso -->
    <div class="top-bar">
        <div class="brand-title">Partiflow <span style="color: white;">PRO</span></div>
        <div class="btn-acciones-top">
            <a href="index.html" class="btn-nav">🏠 Volver al Inicio</a>
            <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </div>

    <!-- Configuración de la Fiesta y Datos del QR -->
    <div class="panel-box">
        <h3>🎉 Configuración de la Fiesta y Evento</h3>
        <div class="input-grupo">
            <label>Nombre de la Fiesta o Motivo:</label>
            <input type="text" id="txtNombreFiesta" value="Cumpleaños / Reunión Principal">
            
            <label>Fecha de la Fiesta:</label>
            <input type="date" id="txtFechaFiesta" value="2026-09-15">

            <label>Ubicación (Enlace de Google Maps para el QR):</label>
            <input type="text" id="txtUbicacion" value="https://maps.google.com">
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span id="lblEstadoFiesta" class="badge-estado badge-activo">Activa en Vivo</span>
            <button class="btn-nav" onclick="guardarConfigFiesta()">Actualizar Evento</button>
        </div>
    </div>

    <!-- Registrar Invitado para el QR -->
    <div class="panel-box">
        <h3>➕ Registrar Invitado (Genera Pase y QR)</h3>
        <div class="input-grupo">
            <label>Nombre del Invitado, Pareja o Familia:</label>
            <input type="text" id="inputNombre" placeholder="Ej. Carlos Ganoza y Familia...">
        </div>
        <button class="btn-generar" onclick="generarPase()">Generar Pase y Enlace QR</button>
    </div>

    <!-- Lista de Pases Activos / Histórico -->
    <div class="panel-box">
        <h3>📋 Lista de Pases Generados</h3>
        <table>
            <thead>
                <tr>
                    <th>Nombre / Grupo</th>
                    <th>Código Único</th>
                    <th>Acción QR</th>
                </tr>
            </thead>
            <tbody id="tablaInvitados">
                <tr><td colspan="3" style="text-align:center; color:#9ca3af;">No hay invitados registrados todavía.</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // Control de fecha y estado histórico automático
        const inputFecha = document.getElementById('txtFechaFiesta');
        const badgeEstado = document.getElementById('lblEstadoFiesta');

        function verificarHistorico() {
            const hoy = new Date().toISOString().split('T')[0];
            if (inputFecha.value && inputFecha.value < hoy) {
                badgeEstado.textContent = "Histórico (Archivado)";
                badgeEstado.className = "badge-estado badge-historico";
            } else {
                badgeEstado.textContent = "Activa en Vivo";
                badgeEstado.className = "badge-estado badge-activo";
            }
        }

        inputFecha.addEventListener('change', verificarHistorico);
        verificarHistorico();

        function guardarConfigFiesta() {
            alert('¡Configuración de la fiesta guardada con éxito!');
            verificarHistorico();
        }

        function cerrarSesion() {
            window.location.href = 'index.html';
        }

        function generarPase() {
            const nombreInput = document.getElementById('inputNombre');
            if (!nombreInput.value.trim()) {
                alert('Escribe el nombre del invitado.');
                return;
            }

            const codigoVIP = 'VIP-' + Math.floor(1000 + Math.random() * 9000);
            const tabla = document.getElementById('tablaInvitados');
            
            if (tabla.querySelector('td[colspan]')) {
                tabla.innerHTML = ''; // Limpiar mensaje de vacío
            }

            const fila = document.createElement('tr');
            fila.innerHTML = `
                <td>${nombreInput.value}</td>
                <td><code style="color:#60a5fa;">${codigoVIP}</code></td>
                <td><a href="invitacion.html?codigo=${codigoVIP}" target="_blank" class="btn-nav" style="padding:4px 8px; font-size:0.8rem;">Ver Pase QR</a></td>
            `;
            tabla.appendChild(fila);
            nombreInput.value = '';
            alert('¡Pase y QR generado con éxito!');
        }
    </script>
</body>
</html>
