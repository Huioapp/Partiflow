<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Partiflow PRO</title>
    <!-- Librería global estable de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #05070a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(135deg, #111827, #1f2937);
            border: 1px solid #374151;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.6rem;
            margin-top: 0;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #3b82f6, #ffffff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        p.sub {
            text-align: center;
            color: #9ca3af;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
        }

        label {
            font-size: 0.85rem;
            color: #d1d5db;
            font-weight: 600;
        }

        input {
            background: #111827;
            border: 1px solid #4b5563;
            padding: 12px 15px;
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #3b82f6;
        }

        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            color: #9ca3af;
        }

        .btn-submit {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .msg {
            margin-top: 15px;
            text-align: center;
            font-size: 0.85rem;
        }

        .msg.error {
            color: #ef4444;
        }

        .msg.success {
            color: #10b981;
        }

        .footer-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #9ca3af;
        }

        .footer-link a {
            color: #60a5fa;
            text-decoration: none;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <h1>Partiflow PRO</h1>
        <p class="sub">Crea tu cuenta de organizador</p>

        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" placeholder="tucorreo@ejemplo.com">
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="password-container">
                <input type="password" id="password" placeholder="Mínimo 6 caracteres">
                <button type="button" class="toggle-password" onclick="togglePassword('password', this)">👁️</button>
            </div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirmar Contraseña</label>
            <div class="password-container">
                <input type="password" id="confirmPassword" placeholder="Repite tu contraseña">
                <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', this)">👁️</button>
            </div>
        </div>

        <button class="btn-submit" onclick="registrarUsuario()">Registrarse</button>

        <div id="mensajeAlerta" class="msg"></div>

        <div class="footer-link">
            ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://zfgrewceocnivqglmjqe.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpmZ3Jld2Nlb2NuaXZxZ2xtanFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwNDcxNTEsImV4cCI6MjEwMzYyMzE1MX0.6kB7eC7sh-SpPhyAeVJkPUuvq7PZPoD6PIh8o78k_vY';
        
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Función para mostrar/ocultar contraseña con el ícono del ojito
        function togglePassword(fieldId, btn) {
            const input = document.getElementById(fieldId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = ' ocultar ';
                btn.style.fontSize = '0.75rem';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
                btn.style.fontSize = '1.1rem';
            }
        }

        async function registrarUsuario() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const alerta = document.getElementById('mensajeAlerta');

            alerta.className = 'msg';
            alerta.textContent = '';

            if (!email || !password || !confirmPassword) {
                alerta.className = 'msg error';
                alerta.textContent = 'Por favor completa todos los campos.';
                return;
            }

            if (password.length < 6) {
                alerta.className = 'msg error';
                alerta.textContent = 'La contraseña debe tener al menos 6 caracteres.';
                return;
            }

            if (password !== confirmPassword) {
                alerta.className = 'msg error';
                alerta.textContent = 'Las contraseñas no coinciden. Verifícalas.';
                return;
            }

            alerta.textContent = 'Registrando cuenta y enviando correo de confirmación...';

            // Registro con Supabase Auth (automáticamente enviará correo de confirmación si está activo en el panel)
            const { data, error } = await _supabase.auth.signUp({
                email: email,
                password: password,
                options: {
                    emailRedirectTo: window.location.origin + '/login.html'
                }
            });

            if (error) {
                alerta.className = 'msg error';
                alerta.textContent = 'Error: ' + error.message;
                return;
            }

            alerta.className = 'msg success';
            alerta.textContent = '¡Registro exitoso! Te hemos enviado un correo de confirmación. Revisa tu bandeja para activar tu cuenta.';
        }
    </script>
</body>
</html>
