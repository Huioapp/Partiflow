<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partiflow PRO - Centro de Control</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background-color: #030712;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Barra de Navegación Global */
        .global-nav {
            position: absolute;
            top: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
            background: rgba(17, 24, 39, 0.8);
            padding: 8px 15px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        .global-nav a {
            color: #9ca3af;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            transition: all 0.2s;
        }
        .global-nav a:hover, .global-nav a.active {
            background: #3b82f6;
            color: #ffffff;
        }

        .stage-lights {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 1; overflow: hidden;
        }
        .light-beam {
            position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.55;
            mix-blend-mode: screen; animation: moveLight 8s infinite alternate ease-in-out;
        }
        .light-1 { width: 380px; height: 380px; background: radial-gradient(circle, #3b82f6, transparent 70%); top: -50px; left: 10%; animation-duration: 6s; }
        .light-2 { width: 420px; height: 420px; background: radial-gradient(circle, #ec4899, transparent 70%); bottom: -50px; right: 10%; animation-duration: 7s; animation-delay: -2s; }

        @keyframes moveLight {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(80px, 60px) scale(1.25); }
            100% { transform: translate(-60px, 100px) scale(0.9); }
        }

        .hero-card {
            position: relative; z-index: 10; width: 100%; max-width: 480px;
            background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 24px;
            padding: 35px 25px; text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            margin-top: 50px;
        }
        .logo-box img {
            max-width: 75px; height: auto; border-radius: 14px;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.6);
            margin-bottom: 15px;
        }

        h1 {
            font-size: 1.8rem; text-transform: uppercase; letter-spacing: 2px; font-weight: 900;
            background: linear-gradient(90deg, #60a5fa, #ffffff, #ec4899);
            -webkit-background-clip: text; background-clip: text; color: transparent; margin: 5px 0;
        }
        .tagline { color: #9ca3af; font-size: 0.9rem; margin-bottom: 25px; }

        .btn-group { display: flex; flex-direction: column; gap: 12px; }
        .btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            padding: 14px 18px; border-radius: 12px; font-size: 0.95rem; font-weight: 700;
            text-decoration: none; cursor: pointer; transition: all 0.25s ease; border: none;
        }
        .btn-primary { background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: #ffffff; box-shadow: 0 8px 18px rgba(59, 130, 246, 0.4); }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-secondary { background: rgba(31, 41, 55, 0.9); color: #e5e7eb; border: 1px solid #4b5563; }
        .btn-secondary:hover { background: #374151; border-color: #60a5fa; color: #ffffff; }
    </style>
</head>
<body>

    <!-- Puente de Navegación Global -->
    <nav class="global-nav">
        <a href="index.html" class="active">🏠 Inicio</a>
        <a href="dashboard-invitados.html">⚙️ Panel Organizador</a>
    </nav>

    <div class="stage-lights">
        <div class="light-beam light-1"></div>
        <div class="light-beam light-2"></div>
    </div>

    <div class="hero-card">
        <div class="logo-box">
            <img src="Logo_fondo_blanco_solo_icono.png" alt="Partiflow PRO">
        </div>

        <h1>Partiflow <span style="color: #3b82f6;">PRO</span></h1>
        <p class="tagline">Elige a dónde deseas ir:</p>

        <div class="btn-group">
            <a href="dashboard-invitados.html" class="btn btn-primary">
                ⚙️ Ir al Panel de Organizador (Configurar Fiesta y Pases)
            </a>
            <a href="cabina.html" class="btn btn-secondary" onclick="alert('Redirigiendo a la cabina de música...');">
                🎶 Ir a la Cabina de Votación y Voz
            </a>
        </div>
    </div>
</body>
</html>
