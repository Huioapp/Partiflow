<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partiflow PRO - El DJ Virtual con IA</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background-color: #030712;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }

        /* --- LUCES DE FIESTA Y DISCOTECA DE FONDO --- */
        .stage-lights {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .light-beam {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.55;
            mix-blend-mode: screen;
            animation: moveLight 8s infinite alternate ease-in-out;
        }

        .light-1 {
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, #3b82f6, transparent 70%);
            top: -50px;
            left: 10%;
            animation-duration: 6s;
        }

        .light-2 {
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, #ec4899, transparent 70%);
            bottom: -50px;
            right: 10%;
            animation-duration: 7s;
            animation-delay: -2s;
        }

        .light-3 {
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, #8b5cf6, transparent 70%);
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulseStrobe 3s infinite ease-in-out;
        }

        .light-4 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #10b981, transparent 70%);
            bottom: 20%;
            left: 5%;
            animation-duration: 9s;
            animation-delay: -4s;
        }

        /* Animación de movimiento de focos */
        @keyframes moveLight {
            0% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(80px, 60px) scale(1.25);
            }
            100% {
                transform: translate(-60px, 100px) scale(0.9);
            }
        }

        /* Pulso de luz estilo beat */
        @keyframes pulseStrobe {
            0%, 100% {
                opacity: 0.3;
                transform: translate(-50%, -50%) scale(0.9);
            }
            50% {
                opacity: 0.75;
                transform: translate(-50%, -50%) scale(1.3);
            }
        }

        /* --- CONTENEDOR PRINCIPAL (TARJETA VIDRIO) --- */
        .hero-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 520px;
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(59, 130, 246, 0.2);
        }

        .logo-box {
            margin-bottom: 20px;
            display: inline-block;
            position: relative;
        }

        .logo-box img {
            max-width: 85px;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.6);
            animation: logoFloat 4s ease-in-out infinite alternate;
        }

        @keyframes logoFloat {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }

        h1 {
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 900;
            background: linear-gradient(90deg, #60a5fa, #ffffff, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        .tagline {
            color: #9ca3af;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        /* --- BARRAS DE ECUALIZADOR DINÁMICAS --- */
        .equalizer {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 5px;
            height: 28px;
            margin-bottom: 25px;
        }

        .bar {
            width: 6px;
            background: linear-gradient(to top, #3b82f6, #ec4899);
            border-radius: 3px;
            animation: bounceBar 1.2s infinite ease-in-out alternate;
        }

        .bar:nth-child(1) { height: 40%; animation-delay: 0.1s; }
        .bar:nth-child(2) { height: 80%; animation-delay: 0.3s; }
        .bar:nth-child(3) { height: 60%; animation-delay: 0.2s; }
        .bar:nth-child(4) { height: 100%; animation-delay: 0.4s; }
        .bar:nth-child(5) { height: 50%; animation-delay: 0.15s; }
        .bar:nth-child(6) { height: 75%; animation-delay: 0.35s; }

        @keyframes bounceBar {
            0% { height: 20%; }
            100% { height: 100%; }
        }

        /* --- BOTONES DE ACCIÓN --- */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s ease;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: #ffffff;
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(59, 130, 246, 0.6);
            opacity: 0.95;
        }

        .btn-secondary {
            background: rgba(31, 41, 55, 0.8);
            color: #e5e7eb;
            border: 1px solid #4b5563;
        }

        .btn-secondary:hover {
            background: #374151;
            border-color: #60a5fa;
            color: #ffffff;
        }

        /* --- BOTÓN DE SONIDO AMBIENTAL --- */
        .btn-audio {
            background: transparent;
            border: 1px solid #374151;
            color: #9ca3af;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 5px;
        }

        .btn-audio:hover {
            color: #ffffff;
            border-color: #ec4899;
            box-shadow: 0 0 10px rgba(236, 72, 153, 0.4);
        }

        .footer-note {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #6b7280;
        }
    </style>
</head>
<body>

    <!-- Fondos de luces móviles estilo discoteca -->
    <div class="stage-lights">
        <div class="light-beam light-1"></div>
        <div class="light-beam light-2"></div>
        <div class="light-beam light-3"></div>
        <div class="light-beam light-4"></div>
    </div>

    <!-- Tarjeta Central de Bienvenida -->
    <div class="hero-card">
        <div class="logo-box">
            <img src="Logo_fondo_blanco_solo_icono.png" alt="Partiflow PRO">
        </div>

        <h1>Partiflow <span style="color: #3b82f6;">PRO</span></h1>
        <p class="tagline">El DJ virtual inteligente que mezcla la música de tu fiesta y conecta a tus invitados.</p>

        <!-- Animación de Ecualizador -->
        <div class="equalizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>

        <!-- Botones Principales -->
        <div class="btn-group">
            <a href="signup.html" class="btn btn-primary">
                ✨ Crear Cuenta de Organizador
            </a>
            <a href="login.html" class="btn btn-secondary">
                🔑 Iniciar Sesión
            </a>
        </div>

        <!-- Control de Sonido de Discoteca (Sintetizador Web Audio) -->
        <button id="audioToggle" class="btn-audio" onclick="toggleClubAudio()">
            🔊 Encender Sonido de Cabina
        </button>

        <p class="footer-note">Partiflow SaaS • Fiestas, Eventos y Reuniones Sociales</p>
    </div>

    <script>
        // --- SINTETIZADOR DE RITMO ELECTRÓNICO (WEB AUDIO API) ---
        let audioCtx = null;
        let isPlaying = false;
        let beatInterval = null;

        function toggleClubAudio() {
            const btn = document.getElementById('audioToggle');

            if (!isPlaying) {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }

                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                startBeat();
                isPlaying = true;
                btn.textContent = '⏸️ Silenciar Cabina';
                btn.style.borderColor = '#10b981';
                btn.style.color = '#10b981';
            } else {
                stopBeat();
                isPlaying = false;
                btn.textContent = '🔊 Encender Sonido de Cabina';
                btn.style.borderColor = '#374151';
                btn.style.color = '#9ca3af';
            }
        }

        function playKick(time) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(140, time);
            osc.frequency.exponentialRampToValueAtTime(30, time + 0.15);

            gain.gain.setValueAtTime(1, time);
            gain.gain.exponentialRampToValueAtTime(0.01, time + 0.15);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(time);
            osc.stop(time + 0.15);
        }

        function playHiHat(time) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(8000, time);

            gain.gain.setValueAtTime(0.2, time);
            gain.gain.exponentialRampToValueAtTime(0.01, time + 0.05);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(time);
            osc.stop(time + 0.05);
        }

        function startBeat() {
            let step = 0;
            beatInterval = setInterval(() => {
                const now = audioCtx.currentTime;
                // Bombo (Kick) cada tiempo fuerte
                if (step % 2 === 0) {
                    playKick(now);
                }
                // Hi-Hat en contratiempos
                playHiHat(now + 0.1);
                step++;
            }, 450); // ~133 BPM
        }

        function stopBeat() {
            if (beatInterval) {
                clearInterval(beatInterval);
                beatInterval = null;
            }
        }
    </script>
</body>
</html>
