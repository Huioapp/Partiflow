<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partiflow PRO - Cabina DJ</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #05070a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #3b82f6;
            padding-bottom: 20px;
            width: 100%;
            max-width: 600px;
        }

        header img {
            max-width: 160px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            margin-bottom: 15px;
        }

        header h1 {
            font-size: 2rem;
            margin: 0;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 900;
            background: linear-gradient(90deg, #3b82f6, #ffffff, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        header p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        #form-cancion {
            width: 100%;
            max-width: 600px;
            background: #111827;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
            border: 1px solid #374151;
            margin-bottom: 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #form-cancion h3 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
            color: #60a5fa;
        }

        .input-grupo {
            display: flex;
            gap: 10px;
        }

        .input-grupo input {
            flex: 1;
            background: #1f2937;
            border: 1px solid #4b5563;
            padding: 10px 15px;
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-grupo input:focus {
            border-color: #3b82f6;
        }

        .btn-agregar {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-agregar:hover {
            opacity: 0.9;
        }

        #lista-canciones {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .cancion-item {
            background: linear-gradient(90deg, #111827, #1f2937, #111827);
            padding: 18px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            border: 1px solid #374151;
            position: relative;
        }

        .titulo-cancion {
            margin: 0;
            font-weight: 800;
            font-size: 1.2rem;
            color: #e5e7eb;
        }

        .artista-cancion {
            margin: 5px 0 0 0;
            color: #9ca3af;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .boton-votar {
            background: transparent;
            border: 2px solid #3b82f6;
            color: #3b82f6;
            padding: 8px 16px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
        }

        .boton-votar:hover {
            background: rgba(59, 130, 246, 0.15);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        /* Animación de zoom limpia en el botón */
        .pulgar-animacion {
            transform: scale(1.15);
        }

        /* Corazones flotantes al votar */
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 1; }
            100% { transform: translateY(-50px) scale(1.3); opacity: 0; }
        }

        .floating-heart {
            position: absolute;
            right: 40px;
            bottom: 25px;
            font-size: 1.3rem;
            pointer-events: none;
            animation: floatUp 0.7s ease-out forwards;
        }

        .corazon {
            font-size: 1.1rem;
        }

        .contador {
            font-size: 1.2rem;
            font-weight: 900;
        }

        @keyframes blink {
            50% { opacity: 0.7; }
        }
        #live-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #10b981;
            border-radius: 50%;
            margin-right: 8px;
            animation: blink 1.5s infinite;
            box-shadow: 0 0 10px #10b981;
        }
    </style>
</head>
<body>

    <header>
        <img src="Logo%20fondo%20blanco.png" alt="Partiflow PRO Logo">
        <h1>Partiflow <span style="color: #ffffff; font-size: 0.6em; vertical-align: super;">PRO</span></h1>
        <p><span id="live-indicator"></span>Cabina de Votación en Vivo (Nube)</p>
    </header>

    <div id="form-cancion">
        <h3>🎵 Pide tu canción</h3>
        <div class="input-grupo">
            <input type="text" id="inputTitulo" placeholder="Título de la canción...">
            <input type="text" id="inputArtista" placeholder="Artista...">
            <button class="btn-agregar" onclick="agregarCancion()">Añadir</button>
        </div>
    </div>

    <div id="lista-canciones">
        <!-- Las canciones se cargarán automáticamente desde Supabase -->
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://zfgrewceocnivqglmjqe.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_AACRBlmLLP0UqwN1cLbvwg_zU...'; // Recuerda poner tu llave partiflow_live completa

        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.addEventListener('DOMContentLoaded', () => {
            cargarCanciones();
            suscripcionRealtime();
        });

        async function cargarCanciones() {
            const { data, error } = await _supabase
                .from('canciones')
                .select('*')
                .order('votos', { ascending: false });

            if (error) {
                console.error('Error al cargar:', error);
                return;
            }

            mostrarEnPantalla(data);
        }

        function suscripcionRealtime() {
            _supabase
                .channel('cambios-canciones')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'canciones' }, payload => {
                    cargarCanciones();
                })
                .subscribe();
        }

        function mostrarEnPantalla(canciones) {
            const lista = document.getElementById('lista-canciones');
            if (!lista) return;
            lista.innerHTML = '';

            canciones.forEach(cancion => {
                const item = document.createElement('div');
                item.className = 'cancion-item';
                item.id = `card-${cancion.id}`;
                item.innerHTML = `
                    <div>
                        <p class="titulo-cancion">${cancion.titulo}</p>
                        <p class="artista-cancion">${cancion.artista}</p>
                    </div>
                    <button class="boton-votar" id="btn-${cancion.id}" onclick="votar(${cancion.id}, ${cancion.votos})">
                        <span class="corazon">❤️</span> <span class="contador" id="contador-${cancion.id}">${cancion.votos}</span>
                    </button>
                `;
                lista.appendChild(item);
            });
        }

        window.agregarCancion = async function() {
            const tituloInput = document.getElementById('inputTitulo');
            const artistaInput = document.getElementById('inputArtista');

            if (!tituloInput || !artistaInput || tituloInput.value.trim() === '' || artistaInput.value.trim() === '') {
                alert('Por favor escribe el título y el artista.');
                return;
            }

            const nuevoId = Math.floor(Date.now() / 1000);

            const { error } = await _supabase
                .from('canciones')
                .insert([{ id: nuevoId, titulo: tituloInput.value, artista: artistaInput.value, votos: 1 }]);

            if (error) {
                alert('Error al guardar la canción: ' + error.message);
                return;
            }

            tituloInput.value = '';
            artistaInput.value = '';
        };

        window.votar = async function(id, votosActuales) {
            const contadorEl = document.getElementById(`contador-${id}`);
            const btn = document.getElementById(`btn-${id}`);
            const card = document.getElementById(`card-${id}`);

            // 1. Actualizar el número en pantalla AL INSTANTE
            const nuevosVotos = votosActuales + 1;
            if (contadorEl) {
                contadorEl.innerText = nuevosVotos;
                // Actualizar también el onclick del botón con el nuevo valor para votaciones seguidas
                btn.setAttribute('onclick', `votar(${id}, ${nuevosVotos})`);
            }

            // 2. Animación rápida del botón
            if (btn) {
                btn.classList.add('pulgar-animacion');
                setTimeout(() => btn.classList.remove('pulgar-animacion'), 200);
            }

            // 3. Lanzar corazoncito flotante
            if (card) {
                const heart = document.createElement('span');
                heart.className = 'floating-heart';
                heart.innerHTML = '💖';
                card.appendChild(heart);
                setTimeout(() => heart.remove(), 700);
            }

            // 4. Enviar el voto a Supabase por detrás
            const { error } = await _supabase
                .from('canciones')
                .update({ votos: nuevosVotos })
                .eq('id', id);

            if (error) {
                console.error('Error al sincronizar voto:', error);
            }
        };
    </script>
</body>
</html>
