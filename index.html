<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partiflow - Música Interactiva</title>
</head>
<body style="margin: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #0f172a; color: #ffffff; font-family: sans-serif; text-align: center; padding: 20px;">
    
    <!-- Tu Logo -->
    <img src="Logo%20fondo%20blanco.png" alt="Partiflow Logo" style="max-width: 280px; width: 80%; height: auto; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);">

    <!-- Mensaje Principal -->
    <h1 style="font-size: 1.8rem; margin-bottom: 10px;">La música de tu evento, en tus manos</h1>
    <p style="color: #94a3b8; max-width: 400px; margin-bottom: 30px; font-size: 1rem;">Conecta, interactúa y controla la atmósfera de la fiesta en tiempo real.</p>

    <!-- Botón Interactivo -->
    <button onclick="alert('¡Próximamente disponible el acceso a salas interactivas!')" style="background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: white; border: none; padding: 12px 30px; font-size: 1rem; font-weight: bold; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);">
        Comenzar Fiesta
    </button>

</body>
</html>
